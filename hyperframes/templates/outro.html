<!doctype html>
<html lang="fr" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="_shared.css" />
<style>
  #mascot { margin-bottom: 10px; transform-origin: 50% 90%; }
  #sub { font-family:"Rubik"; font-weight:800; font-size:104px; color:var(--ink); background:var(--orange);
    border-radius:32px; padding:20px 60px 28px; box-shadow:0 14px 0 #B87A06; margin-top:60px; }
  #next { font-family:"Inter"; font-weight:800; font-size:50px; color:var(--text); opacity:.9; margin-top:70px; text-align:center; }
  #next b { display:block; font-family:"Rubik"; font-weight:800; font-size:92px; color:var(--orange); }
  .wordmark { font-size:110px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
  <audio id="vo" src="outro.wav" data-start="0.2" data-duration="{{VO_DUR}}"></audio>
  <audio id="sfx-whoosh" src="sfx/whoosh.wav" data-start="0" data-duration="0.42" data-volume="0.35"></audio>
  <audio id="sfx-boing" src="sfx/boing.wav" data-start="0.35" data-duration="0.5" data-volume="0.35"></audio>
  <audio id="sfx-pop" src="sfx/pop.wav" data-start="0.55" data-duration="0.11" data-volume="0.45"></audio>
  <audio id="sfx-levelup" src="sfx/levelup.wav" data-start="1.0" data-duration="0.53" data-volume="0.3"></audio>
  <div id="scene" class="clip center" data-start="0" data-duration="{{DUR}}">
    <img id="mascot" src="mascot.png" width="460" height="475" alt="" />
    <div id="word" class="wordmark">MOTO <span class="o">DÉCODE</span></div>
    <div id="by" class="by">by <span>{{AUTHOR}}</span></div>
    <div id="sub">ABONNE-TOI !</div>
    <div id="next">Prochain épisode<b>{{NEXT}}</b></div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#mascot", { y: -700 }, { y: 0, duration: 0.6, ease: "bounce.out" }, 0);
  tl.to("#mascot", { rotation: 6, y: -14, duration: 0.3, repeat: Math.floor(({{DUR}} - 0.7) / 0.3), yoyo: true, ease: "sine.inOut" }, 0.6);
  tl.fromTo("#word", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
  tl.fromTo("#by", { scale: 0, rotation: 20 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 0.4);
  tl.fromTo("#sub", { scale: 0, rotation: -15 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.5)" }, 0.5);
  tl.to("#sub", { scale: 1.08, duration: 0.35, repeat: Math.floor(({{DUR}} - 1) / 0.35), yoyo: true, ease: "sine.inOut" }, 1.0);
  tl.fromTo("#next", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.9);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
