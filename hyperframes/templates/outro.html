<!doctype html>
<html lang="fr" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="_shared.css" />
<style>
  #mascot { margin-bottom: 10px; transform-origin: 50% 90%; }
  #sub { font-family:"Lilita One"; font-size:110px; color:#fff; background:var(--red); border:10px solid var(--ink);
    border-radius:36px; padding:20px 60px 30px; box-shadow:14px 14px 0 var(--ink); margin-top:60px; }
  #next { font-family:"Nunito"; font-weight:900; font-size:54px; color:var(--ink); margin-top:70px; text-align:center; }
  #next b { display:block; font-family:"Lilita One"; font-weight:400; font-size:96px; color:var(--orange);
    -webkit-text-stroke:6px var(--ink); paint-order:stroke fill; }
  .wordmark { font-size:110px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
  <audio id="vo" src="outro.wav" data-start="0.2" data-duration="{{VO_DUR}}"></audio>
  <div id="scene" class="clip center" data-start="0" data-duration="{{DUR}}">
    <img id="mascot" src="mascot.png" width="460" height="475" alt="" />
    <div id="word" class="wordmark">MOTO <span class="o">DÉCODE</span></div>
    <div id="sub">ABONNE-TOI !</div>
    <div id="next">Prochain épisode<b>{{NEXT}}</b></div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#mascot", { y: -700 }, { y: 0, duration: 0.6, ease: "bounce.out" }, 0);
  tl.to("#mascot", { rotation: 6, y: -14, duration: 0.3, repeat: Math.floor(({{DUR}} - 0.7) / 0.3), yoyo: true, ease: "sine.inOut" }, 0.6);
  tl.fromTo("#word", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
  tl.fromTo("#sub", { scale: 0, rotation: -15 }, { scale: 1, rotation: -3, duration: 0.5, ease: "back.out(2.5)" }, 0.5);
  tl.to("#sub", { scale: 1.08, duration: 0.35, repeat: Math.floor(({{DUR}} - 1) / 0.35), yoyo: true, ease: "sine.inOut" }, 1.0);
  tl.fromTo("#next", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.9);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
